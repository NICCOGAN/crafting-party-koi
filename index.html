<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crafting-KMZ-Garage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hero">
    <div class="content">
      <h1>⛩️KMZ - Garage⛩️</h1>
      <p>⛩️KAMIKAZE GARAGE⛩️OPEN!. KAMI MELAYANI SERVICE, COSME, & RATA KANAN KENDARAAN (📌Koor. TERMINAL). ARIGATO✨</p>
    </div>
  </div>

  <form id="craftForm" class="flex-row">
    <!-- Makanan -->
    <fieldset>
      <legend><strong>Makanan</strong></legend>
      <label><input type="checkbox" name="makanan" value="Mochi"> Mochi (x50)</label>
      <input type="number" id="jumlahMochi" placeholder="Jumlah Paket" min="1" /><br>
  
      <label><input type="checkbox" name="makanan" value="Ramen"> Ramen (x50)</label>
      <input type="number" id="jumlahRamen" placeholder="Jumlah Paket" min="1" /><br>
  
      <label><input type="checkbox" name="makanan" value="Udon"> Udon (x50)</label>
      <input type="number" id="jumlahUdon" placeholder="Jumlah Paket" min="1" /><br>
  
      <button type="button" onclick="hitungBahan('makanan')">Hitung Bahan</button>
      <div id="bahanMakanan" class="hasil-bahan"></div>
    </fieldset>
  
    <!-- Minuman -->
    <fieldset>
      <legend><strong>Minuman</strong></legend>
      <label><input type="checkbox" name="minuman" value="IceOcha"> Ice Ocha (x50)</label>
      <input type="number" id="jumlahIceOcha" placeholder="Jumlah Paket" min="1" /><br>
  
      <button type="button" onclick="hitungBahan('minuman')">Hitung Bahan</button>
      <div id="bahanMinuman" class="hasil-bahan"></div>
    </fieldset>
  
    <!-- Barang -->
    <fieldset>
      <legend><strong>Barang</strong></legend>
      <label><input type="checkbox" name="barang" value="RokokBatang"> Rokok Batang (x12)</label>
      <input type="number" id="jumlahRokokBatang" placeholder="Jumlah Paket" min="1" /><br>
  
      <label><input type="checkbox" name="barang" value="RokokKoi7Star"> Rokok Koi 7Star (x10)</label>
      <input type="number" id="jumlahRokokKoi7Star" placeholder="Jumlah Paket" min="1" /><br>
  
      <label><input type="checkbox" name="barang" value="Korek"> Korek (x10)</label>
      <input type="number" id="jumlahKorek" placeholder="Jumlah Paket" min="1" /><br>
  
      <button type="button" onclick="hitungBahan('barang')">Hitung Bahan</button>
      <div id="bahanBarang" class="hasil-bahan"></div>
    </fieldset>
  </form>  

 <!-- Tempat untuk menampilkan hasil perhitungan bahan -->
 <div id="bahanMakanan" class="hasil-bahan"></div>
  <footer>
    <p>Lastest Updated: 07/05/2025</p>
    <p>Credit by: PARTY KOI - WIMMPY N MORVINHO</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
